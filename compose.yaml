services:
  db:
    image: mysql:8.4
    container_name: salpim-db
    restart: unless-stopped
    command: ["--local-infile=1"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - salpim_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/umc-10th-salpim/salpim-server:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: salpim-api
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  salpim_mysql_data:
