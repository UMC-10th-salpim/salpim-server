spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url:  ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  override-with-generic-response: false

geocoding:
  base-url: ${GEOCODING_BASE_URL:https://dapi.kakao.com}
  api-key: ${KAKAO_LOCAL_API_KEY:}

