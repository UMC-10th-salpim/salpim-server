spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url:  ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  override-with-generic-response: false

welfare:
  api:
    CentralKey: ${WELFARE_CENTRAL_API_KEY}
    LocalKey: ${WELFARE_LOCAL_API_KEY}

bokjiro:
  base-url: https://apis.data.go.kr/B554287/NationalWelfareInformationsV001
  local-base-url: https://apis.data.go.kr/B554287/LocalGovernmentWelfareInformations
  service-key: ${WELFARE_CENTRAL_API_KEY}
  local-service-key: ${WELFARE_LOCAL_API_KEY}
