spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:salpim-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  override-with-generic-response: false

geocoding:
  base-url: https://dapi.kakao.com
  api-key:

jwt:
  secret-key: test-jwt-secret-key-must-be-at-least-32-bytes
  access-token-expiration-millis: 3600000
  refresh-token-expiration-millis: 1209600000
