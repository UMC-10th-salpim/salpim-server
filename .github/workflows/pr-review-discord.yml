name: PR Review Discord Notification

on:
  pull_request:
    types: [ready_for_review, review_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  notify-reviewer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const reviewerMap = {
              "Sangrix": "704687526970916964",
              "tjdals-dbs": "371117422452801537",
              "migi0401": "1419671394425376829",
              "Jihong02": "448334032338419713",
              "2u6in": "612965490192678912"
            };

            const webhookUrl = process.env.DISCORD_WEBHOOK_URL;
            const pr = context.payload.pull_request;

            if (!webhookUrl) {
              core.setFailed("DISCORD_WEBHOOK_URL secret is missing.");
              return;
            }

            if (!pr) {
              console.log("No pull request payload. Skipping.");
              return;
            }

            async function sendDiscord(message) {
              const response = await fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  content: message,
                  allowed_mentions: {
                    parse: ["users"]
                  }
                })
              });

              if (!response.ok) {
                throw new Error(`Discord webhook failed: ${response.status}`);
              }
            }

            let reviewers = [];

            if (context.payload.action === "review_requested") {
              const requestedReviewer = context.payload.requested_reviewer;
              if (requestedReviewer) {
                reviewers = [requestedReviewer];
              }
            } else {
              reviewers = pr.requested_reviewers ?? [];
            }

            if (reviewers.length === 0) {
              console.log("No requested reviewers. Skipping.");
              return;
            }

            for (const reviewer of reviewers) {
              const discordId = reviewerMap[reviewer.login];

              if (!discordId) {
                console.log(`No Discord mapping for ${reviewer.login}`);
                continue;
              }

              await sendDiscord(
                `<@${discordId}> PR 리뷰 요청이 왔어요.\n\n` +
                `**${pr.title}**\n` +
                `${pr.html_url}`
              );
            }
